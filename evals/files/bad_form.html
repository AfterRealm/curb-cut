<!-- Registration form with multiple accessibility violations -->
<div class="form-container">
  <div style="font-size: 24px; font-weight: bold;">Create Account</div>

  <div class="form-group">
    <input type="text" placeholder="Full Name" class="input-field">
  </div>

  <div class="form-group">
    <input type="text" placeholder="Email Address" class="input-field">
  </div>

  <div class="form-group">
    <input type="text" placeholder="Password" class="input-field">
  </div>

  <div class="form-group">
    <input type="text" placeholder="Confirm Password" class="input-field">
  </div>

  <div class="form-group">
    <span style="color: red;">*</span> Agree to Terms
    <input type="checkbox">
  </div>

  <div class="form-group">
    <div style="font-weight: bold;">Account Type</div>
    <input type="radio" name="type"> Personal
    <input type="radio" name="type"> Business
  </div>

  <div class="error-message" style="color: red; display: none;">
    Please fix the errors above
  </div>

  <div class="submit-btn" onclick="submitForm()" style="background: #007bff; color: white; padding: 8px 16px; cursor: pointer; display: inline-block;">
    Go
  </div>

  <p style="font-size: 11px; color: #999;">
    By signing up you agree to our <a href="#">terms</a> and <a href="#">policy</a>.
  </p>
</div>

<script>
function submitForm() {
  var inputs = document.querySelectorAll('.input-field');
  var hasError = false;
  inputs.forEach(function(input) {
    if (!input.value) {
      input.style.borderColor = 'red';
      hasError = true;
    }
  });
  if (hasError) {
    document.querySelector('.error-message').style.display = 'block';
  }
}
</script>
